 distributedCache:
  container_name: distributedcache
  restart: always
  ports:
   - "6379:6379"
 basketdb:
  container_name: basketdb
  environment:
   - POSTGRES_USER=postgres
   - POSTGRES_PASSWORD=postgres
   - POSTGRES_DB=BasketDb
  restart: always
  ports: 
   - "5432:5432"
  volumes:
   - postgres_data_shop:/var/lib/postgresql/data/
 orderdb:
  container_name: orderdb
  environment:
   - ACCEPT_EULA=sa
   - MSSQL_SA_PASSWORD=SwN12345678
  restart: always
  ports:
   - "1433:1433"
  volumes:
   - mssql_data_shop:/var/opt/mssql
