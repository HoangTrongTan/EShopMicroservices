 distributedCache:
  container_name: distributedcache
  restart: always
  ports:
   - "6379:6379"
  volumes:
   - redis-data:/data
  healthcheck:
   test: ["CMD", "redis-cli", "ping"]
   interval: 10s
   retries: 5
   timeout: 5s

 basketdb:
  container_name: basketdb
  environment:
   - POSTGRES_USER=postgres
   - POSTGRES_PASSWORD=postgres
   - POSTGRES_DB=BasketDb
  restart: always
  ports: 
   - "5432:5432"
  volumes:
   - pg-data:/var/lib/postgresql/data/
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d BasketDb"]
    interval: 10s
    timeout: 5s
    retries: 5

 orderdb:
  container_name: orderdb
  environment:
   - ACCEPT_EULA=Y
   - MSSQL_SA_PASSWORD=SwN12345678
  restart: always
  ports:
   - "1433:1433"
  volumes:
   - sql-dev-data:/var/opt/mssql
  healthcheck:
   test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost - U sa -P 'SwN12345678' -Q 'SELECT 1' || exit 1"]
   # -S chỉ định Server cần connect, ở đây là localhost
   # /opt/.. đường dân tới công cụ dòng lệnh
   # -U sa tên tài khoản
   # -Q query thử
   interval: 10s
   retries: 5
   timeout: 5s

 messagebroker:
  image: rabbitmq:4-management-alpine
  container_name: messagebroker
  hostname: ecommerce-mq
  environment:
   - RABBITMQ_DEFAULT_USER=guest
   - RABBITMQ_DEFAULT_PASS=guest
  restart: always
  ports:
   - "5672:5672"
   - "15672:15672"
  volumes:
   - rabbitmq-data:/var/lib/rabbitmq
  healthcheck:
   test: ["CMD", "rabbitmq-diagnostics", "check_running"]
   interval: 10s
   retries: 5
   timeout: 5s

 # catalog.api:
 #   environment:
 #    - ASPNETCORE_ENVIRONMENT=Development
 #    - ASPNETCORE_HTTP_PORTS=8080
 #    - ASPNETCORE_HTTPS_PORTS=8081
 #    - ConnectionStrings__Database=Server=192.168.17.131;Port=5432;Database=CatalogDb;User Id=postgres;Password=postgres;Include Error Detail=true 
 #   depends_on:
 #    - catalogdb
 #   ports:
 #    - "6000:8080"
 #    - "6060:8081"
 #   volumes:
 #    - ${HOME}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
 #    - ${HOME}/ASP.NET/Https:/home/app/.aspnet/https:ro

 basket.api:
   environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - ASPNETCORE_HTTP_PORTS=8080
    # - ASPNETCORE_HTTPS_PORTS=8081
    - ConnectionStrings__Database=Server=basketdb;Port=5432;Database=BasketDb;User Id=postgres;Password=postgres;Include Error Detail=true 
    - ConnectionStrings__Redis=distributedCache:6379
    - GrpcSettings__DiscountUrl=http://discount.grpc:8080
    - MessageBroker__Host=amqp://messagebroker:5672
    - MessageBroker__UserName=guest
    - MessageBroker__Password=guest
    - FeatureManagement__OrderFullfilment=true
    
   ports:
    - "6001:8080"
   depends_on:
    basketdb:
     condition: service_healthy
    distributedCache:
     condition: service_healthy
    discount.grpc:
     condition: service_started
    messagebroker:
     condition: service_healthy
   healthcheck:
    test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
    # -f là --fail nếu error code thì sẽ ngắt
    interval: 10s
    retries: 5
    timeout: 5s
    # - "5051:8081"
   # volumes:
    # - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
    # - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    
 ordering.api:
  environment:
   - ASPNETCORE_ENVIRONMENT=Development
   - ASPNETCORE_HTTP_PORTS=8080
   - ConnectionStrings__Database=Server=orderdb,1433;Database=OrderDb;User Id=sa;Password=SwN12345678;Encrypt=False;TrustServerCertificate=True;
   - MessageBroker__Host=amqp://messagebroker:5672
   - MessageBroker__UserName=guest
   - MessageBroker__Password=guest
   - FeatureManagement__OrderFullfilment=true
   
  ports:
   - "6003:8080"
  depends_on:
   orderdb:
    condition: service_healthy
   messagebroker:
    condition: service_healthy
  healthcheck:
   test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
   interval: 10s
   retries: 5
   timeout: 5s

 discount.grpc:
  container_name: discount.grpc
  environment:
   - ASPNETCORE_ENVIRONMENT=Development
   - ASPNETCORE_HTTP_PORTS=8080
   # - ASPNETCORE_HTTPS_PORTS=8081
   - ConnectionStrings__Database=Data Source=/app/data/discountdb
   # để folder đúng config ở docker
  ports:
   - "6002:8080"
   # - "8081"
  volumes:
   - sql-lite-data:/app/data
  healthcheck:
   test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
   interval: 10s
   retries: 5
   timeout: 5s

  # volumes:
   # - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
   # - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro